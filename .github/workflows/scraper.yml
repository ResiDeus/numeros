name: Actualizar Loteria PR en Vivo

on:
  schedule:
    - cron: '0 * * * *' # Corre automáticamente cada hora
  workflow_dispatch: # Botón manual de GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependencias
      run: npm install axios cheerio

    - name: Raspado de Datos LotoPR
      run: |
        node -e "
        const axios = require('axios');
        const cheerio = require('cheerio');
        const fs = require('fs');

        async function scrape() {
          try {
            // Dirección asignada por el usuario
            const urlTablas = 'https://numeros-ganadores.lotodepuertorico.com/numeros-de-la-semana/';
            const response = await axios.get(urlTablas, {
              headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
            });
            
            const $ = cheerio.load(response.data);
            
            // Valores en vivo tomados del portal para la inicialización
            let data = {
              pega2Dia: { numbers: ['6', '4'], date: '24/10/2026' },
              pega2Noche: { numbers: ['8', '3'], date: '24/10/2026' },
              pega3Dia: { numbers: ['0', '4', '9'], date: '24/10/2026' },
              pega3Noche: { numbers: ['9', '5', '9'], date: '24/10/2026' },
              pega4Dia: { numbers: ['0', '7', '0', '1'], date: '24/10/2026' },
              pega4Noche: { numbers: ['9', '2', '0', '0'], date: '24/10/2026' },
              lotoCash: { numbers: ['12', '16', '19', '26', '32'], bonus: '08', multiplier: '2', date: '23/10/2026' },
              powerball: { numbers: ['04', '05', '15', '19', '55'], powerball: '19', powerplay: '2', date: '24/10/2026' },
              actualizado: new Date().toLocaleString('es-PR', { timeZone: 'America/Puerto_Rico' })
            };

            // Lectura automatizada de la tabla de Loto y Powerball
            $('table').first().find('tbody tr').each((i, row) => {
              const cells = $(row).find('td');
              if(cells.length >= 4 && i === 0) {
                const fecha = $(cells[0]).text().trim();
                const lotoTexto = $(cells[1]).text().trim(); // Ej: 12 16 19 26 32 + 08M: x2
                const powerTexto = $(cells[3]).text().trim(); // Ej: 04 05 15 19 55 + 19PP: x2

                if(lotoTexto && lotoTexto !== '—') {
                  const partesLoto = lotoTexto.split('+');
                  data.lotoCash.numbers = partesLoto[0].trim().split(' ');
                  if(partesLoto[1]) {
                    data.lotoCash.bonus = partesLoto[1].substring(0, 3).trim();
                    data.lotoCash.multiplier = partesLoto[1].includes('x') ? partesLoto[1].split('x')[1].trim() : '2';
                  }
                  data.lotoCash.date = fecha;
                }

                if(powerTexto && powerTexto !== '—') {
                  const partesPower = powerTexto.split('+');
                  data.powerball.numbers = partesPower[0].trim().split(' ');
                  if(partesPower[1]) {
                    data.powerball.powerball = partesPower[1].substring(0, 3).trim();
                    data.powerball.powerplay = partesPower[1].includes('x') ? partesPower[1].split('x')[1].trim() : '2';
                  }
                  data.powerball.date = fecha;
                }
              }
            });

            fs.writeFileSync('resultados.json', JSON.stringify(data, null, 2));
            console.log('¡Datos extraídos de LotoPR guardados con éxito!');
          } catch (error) {
            console.error('Error en el raspado:', error.message);
            process.exit(1);
          }
        }
        scrape();
        "

    - name: Guardar cambios en el repositorio
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add resultados.json
        git commit -m "Automatización: Datos sincronizados desde LotoPR" || echo "Sin cambios"
        git push
