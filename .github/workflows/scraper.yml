name: Actualizar Loteria PR en Vivo

on:
  schedule:
    - cron: '0 * * * *' # Revisa cada hora automáticamente
  workflow_dispatch: # Permite forzar de forma manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependencias de scraping
      run: npm install axios cheerio

    - name: Extraer Numeros Oficiales de PR
      run: |
        node -e "
        const axios = require('axios');
        const cheerio = require('cheerio');
        const fs = require('fs');

        async function scrape() {
          try {
            // Consultamos LotteryUSA que tiene una estructura fija muy robusta
            const response = await axios.get('https://lotteryusa.com', {
              headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
            });
            const $ = cheerio.load(response.data);

            let data = {
              pega3: [],
              pega4: [],
              lotoCash: [],
              lotoMultiplicador: '2',
              actualizado: new Date().toLocaleString('es-PR', { timeZone: 'America/Puerto_Rico' })
            };

            // 1. Extraer Pega 3
            $('.game-id-pr-pega-3 .draw-result li').each((i, el) => {
              data.pega3.push($(el).text().trim());
            });

            // 2. Extraer Pega 4
            $('.game-id-pr-pega-4 .draw-result li').each((i, el) => {
              data.pega4.push($(el).text().trim());
            });

            // 3. Extraer Loto Cash
            $('.game-id-pr-loto-cash .draw-result li').each((i, el) => {
              let num = $(el).text().trim();
              if (num) data.lotoCash.push(num);
            });

            // Contingencia crítica por si cambian clases: si el scraper falla, no escribe ceros, lanza error de verdad
            if (data.pega3.length === 0 || data.pega4.length === 0) {
               throw new Error('No se pudieron encontrar las etiquetas del juego en el diseño de la página.');
            }

            fs.writeFileSync('resultados.json', JSON.stringify(data, null, 2));
            console.log('¡Resultados guardados con éxito!');
          } catch (error) {
            console.error('Error durante el scraping:', error);
            process.exit(1); // Detiene el flujo con error para avisar en vez de inyectar datos falsos
          }
        }
        scrape();
        "

    - name: Guardar cambios en el repositorio
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add resultados.json
        git commit -m "Automatización: Números de lotería actualizados en tiempo real" || echo "No hay sorteos nuevos para guardar"
        git push
